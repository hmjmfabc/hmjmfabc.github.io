<!DOCTYPE html>
<!-- SGU 状态监测 静态构建版本: handoff -->
<html lang="zh-CN" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SGU 剑客群组服 状态监测</title>
  <meta name="description" content="SGU 剑客群组服 各服务状态监测">
  <meta name="theme-color" id="theme-color" content="#d7b777">
  <link rel="icon" type="image/png" href="/favicon.png?v=handoff">
  <link rel="apple-touch-icon" href="/favicon.png?v=handoff">
  <meta property="og:title" content="SGU 剑客群组服 状态监测">
  <meta property="og:description" content="SGU 剑客群组服 各服务状态监测">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="/style.css?v=handoff">
  <script>
    /* 在首次绘制前确定主题，避免闪白 */
    (function () {
      var theme = 'light';
      try {
        var saved = localStorage.getItem('sgu-theme');
        if (saved === 'dark' || saved === 'light') {
          theme = saved;
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          theme = 'dark';
        }
      } catch (e) { /* 隐私模式下忽略 */ }
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.getElementById('theme-color');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#0b0e13' : '#d7b777');
    })();
  </script>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换到深色模式" title="切换到深色模式">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2"></circle>
      <path d="M12 2.4v2.3M12 19.3v2.3M2.4 12h2.3M19.3 12h2.3M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"></path>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20.6 14.7A8.7 8.7 0 1 1 9.3 3.4a6.9 6.9 0 0 0 11.3 11.3z"></path>
    </svg>
  </button>

  <div class="container">
    <div class="main">
      <h1 class="title-flex">
        <span class="logo-wrapper">
          <img class="logo" src="/logo.png?v=handoff" alt="剑客群组服" width="48" height="48">
        </span>
        <span class="site-title">SGU 剑客群组服 状态监测</span>
      </h1>

      <div class="shadow-box list overall-status loading" id="overall" data-status="unknown">
        <span class="dot" aria-hidden="true"></span>
        <span class="overall-text" id="overall-text">正在获取服务器状态…</span>
        <span class="overall-sub" id="overall-sub"></span>
      </div>

      <div class="notice" id="notice"></div>

      <div class="alert-heading description">
        <p>SGU 剑客群组服 各服务状态监测</p>
        <p class="source-note" id="source-note"></p>
      </div>

      <div id="groups" class="mb-4">
        <div class="group">
          <h2 class="group-title">
            <span class="badge status-loading">载入中</span>
            <span class="group-name">正在获取状态…</span>
          </h2>
          <div class="shadow-box monitor-list">
            <div class="item skeleton">
              <div class="row">
                <div class="col-left">
                  <div class="info">
                    <span class="badge kind-badge">IPv4</span>
                    <span class="line-name"><span class="dot"></span>加载中…</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <section class="shadow-box backend-card" id="backend-card" aria-labelledby="backend-title">
        <h2 class="backend-title" id="backend-title">后端选择</h2>
        <p class="backend-subtitle">
          选择状态数据的获取方式，设置会保存在本机浏览器中。当前生效：<strong id="backend-active">加载中…</strong>
        </p>
        <div class="backend-options" id="backend-options"></div>
        <p class="backend-note" id="backend-note"></p>
      </section>

      <footer>
        <div class="footer-copyright">Copyright © 剑客群组服 2024～2026</div>
        <div class="refresh-info">
          <div id="last-updated">最后更新于 —</div>
          <div id="countdown-text">将于 — 后刷新</div>
        </div>
      </footer>
    </div>
  </div>

  <noscript>
    <div class="container">
      <div class="shadow-box list" style="padding:16px">
        本页面需要启用 JavaScript 才能显示实时状态。
      </div>
    </div>
  </noscript>

  <script src="/config.js?v=handoff"></script>
  <script src="/motd.js?v=handoff"></script>
  <script src="/probe.js?v=handoff"></script>
  <script src="/app.js?v=handoff"></script>
</body>
</html>
